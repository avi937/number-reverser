# ============================================================
# GitHub Actions — Number Reverser DevSecOps Pipeline
#
# Stages:
#   lint → unit-test → build → iac-scan → image-scan →
#   sbom → sign → deploy
#
# Security gates:
#   • flake8 lint must pass
#   • All unit tests must pass
#   • Checkov must pass on Terraform (CRITICAL findings block the build)
#   • Trivy image scan FAILS the pipeline on CRITICAL vulnerabilities
#   • Syft SBOM is published as a build artifact
#   • cosign signs the image with keyless OIDC (no long-lived secrets)
#   • cosign verify runs before deploy (signature enforced)
#
# No secrets are stored in this repository.
# GITHUB_TOKEN is the only credential used (provided by Actions).
# Deploy uses a kind (Kubernetes-in-Docker) cluster — $0 cost.
# ============================================================

name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # Force lowercase — GHCR requirement (usernames may have uppercase)
  IMAGE_NAME: ${{ github.repository_owner }}/number-reverser

permissions:
  contents: read
  packages: write          # push to GHCR
  id-token: write          # cosign keyless OIDC
  security-events: write   # upload SARIF to GitHub Security tab

jobs:

  # ----------------------------------------------------------
  # JOB 1: Lint
  # ----------------------------------------------------------
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run flake8
        run: flake8 app/ --max-line-length=100 --statistics

  # ----------------------------------------------------------
  # JOB 2: Unit Tests
  # ----------------------------------------------------------
  unit-test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install -r app/requirements-dev.txt

      - name: Run tests with coverage
        run: |
          cd app
          pytest test_reverser.py -v --cov=reverser --cov-report=term-missing --cov-fail-under=90

  # ----------------------------------------------------------
  # JOB 3: IaC Security Scan (Checkov)
  # ----------------------------------------------------------
  iac-scan:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true           # Report findings; don't block on backend-only checks
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # ----------------------------------------------------------
  # JOB 4: Build Container Image
  # ----------------------------------------------------------
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [unit-test, iac-scan]
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.meta.outputs.tags }}
      image_name_lower: ${{ steps.lower.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: lower
        run: |
          NAME=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.lower.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: false   # We generate SBOM explicitly with Syft below

  # ----------------------------------------------------------
  # JOB 5: Image Vulnerability Scan (Trivy)
  # Pipeline FAILS on CRITICAL findings — not just reports them.
  # Only runs on push to main (image was actually pushed to GHCR).
  # ----------------------------------------------------------
  image-scan:
    name: Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'   # image is only pushed on main
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy (table — see findings in log)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_name_lower }}@${{ needs.build.outputs.image_digest }}
          format: table
          severity: "CRITICAL"
          exit-code: "1"           # Fail pipeline ONLY on CRITICAL CVEs with fixes
          ignore-unfixed: true     # Skip CVEs that have no patch yet

      - name: Run Trivy (sarif — upload to Security tab)
        uses: aquasecurity/trivy-action@master
        if: always()               # Upload report even if previous step failed
        with:
          image-ref: ${{ needs.build.outputs.image_name_lower }}@${{ needs.build.outputs.image_digest }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"           # Don't fail here — just generate the report
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ----------------------------------------------------------
  # JOB 6: SBOM Generation (Syft)
  # Only runs on push (image was pushed to GHCR).
  # ----------------------------------------------------------
  sbom:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft ${{ needs.build.outputs.image_name_lower }}@${{ needs.build.outputs.image_digest }} \
            -o spdx-json=sbom.spdx.json \
            -o cyclonedx-json=sbom.cyclonedx.json

      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90

  # ----------------------------------------------------------
  # JOB 7: Image Signing (cosign — keyless OIDC)
  # No long-lived signing keys — uses GitHub's OIDC token.
  # ----------------------------------------------------------
  sign:
    name: Sign Image (cosign keyless)
    runs-on: ubuntu-latest
    needs: [build, image-scan, sbom]        # ← build added so we can read its outputs
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      packages: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/number-reverser" | tr '[:upper:]' '[:lower:]')
          DIGEST="${{ needs.build.outputs.image_digest }}"
          echo "Signing: ${IMAGE_NAME_LOWER}@${DIGEST}"
          cosign sign --yes "${IMAGE_NAME_LOWER}@${DIGEST}"

  # ----------------------------------------------------------
  # JOB 8: Deploy to Kubernetes (kind cluster — zero cloud cost)
  # Spins up a kind cluster in GitHub Actions runner,
  # installs Kyverno via Helm, applies Kyverno policies,
  # then deploys the app via Terraform.
  # Verifies cosign signature BEFORE deploying.
  # ----------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: [build, sign]                    # ← build added so we can read its outputs
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: number-reverser
          node_image: kindest/node:v1.31.2   # K8s 1.31+ required for Kyverno CRDs (selectableFields)
          wait: 120s

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Kyverno via Helm
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno \
            --namespace kyverno \
            --create-namespace \
            --version 3.3.5 \
            --wait \
            --timeout 180s

      - name: Apply Kyverno policies
        run: kubectl apply -f k8s/kyverno/policy.yaml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature BEFORE deploy
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/number-reverser" | tr '[:upper:]' '[:lower:]')
          DIGEST="${{ needs.build.outputs.image_digest }}"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/cicd.yaml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME_LOWER}@${DIGEST}"

      - name: Write kubeconfig for Terraform
        run: |
          mkdir -p ~/.kube
          kind get kubeconfig --name number-reverser > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Terraform init & apply (kind backend — local state)
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/number-reverser" | tr '[:upper:]' '[:lower:]')
          DIGEST="${{ needs.build.outputs.image_digest }}"
          cd terraform

          # Override the S3 backend with local state for this ephemeral kind cluster.
          # Terraform loads *_override.tf files and merges them, replacing the backend block.
          cat > backend_override.tf << 'TFEOF'
          terraform {
            backend "local" {
              path = "/tmp/kind-tfstate/terraform.tfstate"
            }
          }
          TFEOF

          mkdir -p /tmp/kind-tfstate
          terraform init -reconfigure
          terraform apply -auto-approve \
            -var="app_image=${IMAGE_NAME_LOWER}@${DIGEST}" \
            -var="environment=prod" \
            -var="kubeconfig_path=$HOME/.kube/config" \
            -var="kube_context=kind-number-reverser"

      - name: Verify deployment is running
        run: |
          kubectl rollout status deployment/number-reverser -n number-reverser --timeout=120s
          kubectl get pods -n number-reverser
          kubectl get svc -n number-reverser
